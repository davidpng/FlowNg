<!doctype html><meta charset="utf-8"><body><script src="lib.js"></script><script>
(async () => { try {
 // section 10 on the LOD daughter and after BTM import
 let L = await newFrame('daughter_lod.html'); let E = L.E;
 await sleep(14000);
 E(`window.hash=c=>{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=0;for(let i=0;i<d.length;i+=16)h=(h*31+d[i]+d[i+1]*3+d[i+2]*7)|0;return h}`);
 const diff = E(`(()=>{const first=plots.filter(p=>p.tabId===activeTabId).slice(0,6);const settled=first.map(p=>hash(document.getElementById('canvas-'+p.id)));first.forEach(p=>{p._lodLevel=2;renderPlot(p)});const fresh=first.map(p=>hash(document.getElementById('canvas-'+p.id)));return {n:first.length,diff:first.filter((p,i)=>settled[i]!==fresh[i]).map(p=>p.id)}})()`);
 R('10.1', 'stale-plot check on the LOD daughter: no differences', diff.n > 0 && diff.diff.length === 0, diff);
 L = await fresh({ fixtures: true, btm: true }); E = L.E; await sleep(6000);
 E(`window.hash=c=>{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=0;for(let i=0;i<d.length;i+=16)h=(h*31+d[i]+d[i+1]*3+d[i+2]*7)|0;return h}`);
 const diff2 = E(`(()=>{const first=plots.filter(p=>p.tabId===activeTabId).slice(0,6);const settled=first.map(p=>hash(document.getElementById('canvas-'+p.id)));first.forEach(p=>{p._lodLevel=2;renderPlot(p)});const fresh=first.map(p=>hash(document.getElementById('canvas-'+p.id)));return {n:first.length,diff:first.filter((p,i)=>settled[i]!==fresh[i]).map(p=>p.id)}})()`);
 R('10.2', 'stale-plot check after BTM import: no differences', diff2.n > 0 && diff2.diff.length === 0, diff2);
 // non-blank plots
 const blank = E(`plots.filter(p=>p.tabId===activeTabId).slice(0,6).map(p=>{const c=document.getElementById('canvas-'+p.id);const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let nonWhite=0;for(let i=0;i<d.length;i+=4*7){if(d[i]<250||d[i+1]<250||d[i+2]<250)nonWhite++}return nonWhite})`);
 R('10.3', 'first-row plots are not blank', blank.every(n => n > 200), blank);
 const tab = E(`document.getElementById('tab-strip').innerText.replace(/\\s+/g,' ')`); R('10.4', 'tabs read "Name (n) x" with a dashed "+ Tab"', /\(\d+\)/.test(tab) && /Tab/.test(tab), tab);
 const tree = E(`(()=>{const r=document.querySelector('.pop-tree-node:not(.pop-file-root)');return r?r.innerText.replace(/\\s+/g,' ').slice(0,60):null})()`);
 R('10.5', 'tree rows show count, % of parent, +, x', !!tree && /%/.test(tree), tree);
 const noTitle = E(`[...document.querySelectorAll('button, select, input[type=range]')].filter(e=>e.offsetParent!==null&&!e.title&&!e.closest('.modal-overlay')&&!e.closest('#check-notice')).map(e=>(e.id||e.className||e.tagName)+':'+(e.textContent||'').trim().slice(0,15))`);
 R('10.6', 'every visible control has a tooltip (title)', noTitle.length === 0, noTitle.slice(0, 12));
 const grey = E(`({undo:document.getElementById('undo-btn').disabled||getComputedStyle(document.getElementById('undo-btn')).opacity, redo:document.getElementById('redo-btn').disabled||getComputedStyle(document.getElementById('redo-btn')).opacity})`);
 R('10.7', 'Redo greyed out when empty', !!grey.redo && grey.redo !== '1', grey);
 const act = E(`[...document.querySelectorAll('#global-toolbar .tool-btn.active')].map(b=>b.id)`); R('10.8', 'exactly one tool highlighted', act.length === 1, act);
 const tick = E(`(()=>{const t=document.querySelector('.plot-card');return !!t})()`); R('10.9', 'plot cards present', tick, '');
 R('10.err', 'console errors', REPORT.errors.length === 0, REPORT.errors);
 N('Screenshots were not inspected by eye in this run (headless harness); pixel comparisons only.');
} catch (e) { REPORT.errors.push('HARNESS ' + e + e.stack); }
await finish('s10'); })();
</script>
